# STUDY PART: Define the related services
services:
# STUDY PART: Database service and persistent files
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env first}
    volumes:
      - school-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
# STUDY PART: API service and database connection
  api:
    build: ./Api
    environment:
      ConnectionStrings__School: "Server=db,1433;Database=StudyLabDocker;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      StudyLabMigrate: "true"
    ports:
      - "127.0.0.1:5100:8080"
    depends_on:
      db:
        condition: service_healthy
# STUDY PART: MVC website calling the API
  website:
    build: ./Website
    environment:
      SchoolApi: http://api:8080/
    ports:
      - "127.0.0.1:5200:8080"
    depends_on:
      api:
        condition: service_started
# STUDY PART: Named storage that survives container replacement
volumes:
  school-data:
