# Deploy the static portfolio after enabling GitHub Pages in repository settings.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/*.test.mjs'
      - 'scripts/slide-*.json'
      - 'scripts/revision-content.json'
      - 'scripts/slide-audit.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Verify LogicLab before publishing
        run: node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare portable static files
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text()
          for filename in ('lefa-malatji.jpeg', 'Lefa-Malatji-CV.pdf', 'favicon.svg', 'favicon.ico'):
              html = html.replace('"/' + filename, '"./' + filename)
          p.write_text(html)
          assert p.exists()
          assert Path('_site/Lefa-Malatji-CV.pdf').exists()
          PY
          touch _site/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the uploaded website artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100'
          for attempt in range(12):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['ARTIFACT_NAME'] and not a['expired']]
              if len(matches) == 1:
                  print('Website artifact is ready for deployment.')
                  break
              if len(matches) > 1:
                  raise SystemExit('Expected a unique website artifact for this attempt.')
              print('Waiting for artifact metadata to become visible.')
              time.sleep(5)
          else:
              raise SystemExit('Website artifact metadata did not become visible within one minute.')
          PYCODE
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
